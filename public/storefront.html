<!doctype html>
<html lang="my">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#059669" />
    <title>Online Shop · Mahar POS</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: #f7f9fc;
        color: #14213d;
        font-family: Inter, "Noto Sans Myanmar", system-ui, sans-serif;
      }
      .wrap {
        width: min(1160px, calc(100% - 28px));
        margin: auto;
      }
      .top {
        position: sticky;
        top: 0;
        z-index: 5;
        background: #ffffffeb;
        backdrop-filter: blur(15px);
        border-bottom: 1px solid #e8edf4;
      }
      .top .wrap {
        height: 68px;
        display: flex;
        align-items: center;
        gap: 11px;
      }
      .logo {
        width: 42px;
        height: 42px;
        border-radius: 11px;
        object-fit: cover;
        background: #eaf8f2;
      }
      .brand {
        min-width: 0;
      }
      .brand b,
      .brand small {
        display: block;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .brand small {
        color: #718096;
        font-size: 11px;
      }
      .cartbtn {
        margin-left: auto;
        border: 0;
        border-radius: 11px;
        background: #059669;
        color: #fff;
        padding: 10px 13px;
        font-weight: 800;
      }
      .hero {
        padding: 35px 0 22px;
        background: linear-gradient(135deg, #ecfdf5, #f8fafc 55%, #fff7ed);
      }
      .hero h1 {
        margin: 0 0 8px;
        font-size: clamp(25px, 5vw, 42px);
      }
      .hero p {
        max-width: 680px;
        margin: 0;
        color: #64748b;
      }
      .tools {
        display: grid;
        grid-template-columns:
          minmax(180px, 1fr) repeat(3, minmax(120px, 180px))
          auto;
        gap: 8px;
        margin: 22px 0 16px;
      }
      .tools input,
      .tools select {
        min-width: 0;
        border: 1px solid #d8e0ea;
        border-radius: 11px;
        padding: 12px 14px;
        background: #fff;
      }
      .tools button {
        border: 0;
        border-radius: 11px;
        padding: 0 15px;
        background: #14213d;
        color: #fff;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(5, minmax(0, 1fr));
        gap: 14px;
        padding-bottom: 55px;
      }
      .card {
        overflow: hidden;
        border: 1px solid #e4eaf1;
        border-radius: 15px;
        background: #fff;
        box-shadow: 0 8px 24px #0f172a08;
        cursor: pointer;
        transition: transform 0.18s ease, box-shadow 0.18s ease;
      }
      .card:hover {
        transform: translateY(-2px);
        box-shadow: 0 12px 30px #0f172a12;
      }
      .photo {
        aspect-ratio: 4 / 3;
        background: #edf2f7;
        position: relative;
      }
      .photo img {
        width: 100%;
        height: 100%;
        object-fit: contain;
        display: block;
        padding: 8px;
      }
      .stock {
        position: absolute;
        right: 8px;
        top: 8px;
        border-radius: 999px;
        padding: 4px 7px;
        background: #ffffffea;
        font-size: 10px;
        font-weight: 800;
      }
      .body {
        padding: 12px;
      }
      .cat {
        font-size: 10px;
        color: #059669;
        font-weight: 800;
        text-transform: uppercase;
      }
      .body h3 {
        font-size: 14px;
        margin: 5px 0 6px;
        line-height: 1.4;
      }
      .desc {
        height: 34px;
        overflow: hidden;
        color: #718096;
        font-size: 11px;
      }
      .price {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-top: 11px;
      }
      .price b {
        font-size: 15px;
      }
      .price button {
        border: 0;
        border-radius: 9px;
        padding: 8px 10px;
        background: #059669;
        color: #fff;
        font-weight: 800;
      }
      .empty {
        grid-column: 1/-1;
        text-align: center;
        padding: 60px;
        color: #718096;
      }
      .pagination {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        padding: 0 0 55px;
      }
      .pagination button {
        min-width: 40px;
        min-height: 40px;
        border: 1px solid #d8e0ea;
        border-radius: 10px;
        background: #fff;
        color: #334155;
        font-weight: 700;
      }
      .pagination button.active { border-color: #059669; background: #059669; color: #fff; }
      .pagination button:disabled { opacity: .45; cursor: not-allowed; }
      .page-summary { color: #64748b; font-size: 12px; }
      .shade {
        position: fixed;
        inset: 0;
        z-index: 20;
        display: none;
        background: #0f172a99;
      }
      .shade.open {
        display: block;
      }
      .drawer {
        position: absolute;
        right: 0;
        top: 0;
        width: min(440px, 100%);
        height: 100%;
        overflow: auto;
        background: #fff;
        padding: 20px;
      }
      .drawer-head {
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      .drawer-head button {
        border: 0;
        background: #edf2f7;
        border-radius: 9px;
        padding: 8px 11px;
      }
      .line {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 8px;
        padding: 12px 0;
        border-bottom: 1px solid #edf2f7;
      }
      .line small {
        display: block;
        color: #718096;
      }
      .line button {
        border: 0;
        background: none;
        color: #dc2626;
      }
      .total {
        display: flex;
        justify-content: space-between;
        padding: 16px 0;
        font-size: 18px;
      }
      .checkout {
        display: grid;
        gap: 10px;
      }
      .checkout input,
      .checkout textarea,
      .checkout select {
        width: 100%;
        border: 1px solid #d8e0ea;
        border-radius: 10px;
        padding: 11px;
      }
      .checkout textarea {
        min-height: 78px;
      }
      .checkout > button {
        border: 0;
        border-radius: 11px;
        padding: 12px;
        background: #059669;
        color: #fff;
        font-weight: 800;
      }
      .notice {
        padding: 10px;
        border-radius: 9px;
        background: #ecfdf5;
        color: #047857;
        font-size: 12px;
      }
      .error {
        background: #fef2f2;
        color: #b91c1c;
      }
      .product-modal {
        position: fixed;
        inset: 0;
        z-index: 30;
        display: none;
        place-items: center;
        padding: 18px;
        background: #0f172ab3;
      }
      .product-modal.open { display: grid; }
      .product-detail {
        position: relative;
        display: grid;
        grid-template-columns: minmax(0, 1.05fr) minmax(280px, .95fr);
        gap: 24px;
        width: min(900px, 100%);
        max-height: min(760px, calc(100vh - 36px));
        overflow: auto;
        padding: 22px;
        border-radius: 18px;
        background: #fff;
      }
      .detail-close {
        position: absolute;
        z-index: 2;
        top: 12px;
        right: 12px;
        width: 36px;
        height: 36px;
        border: 0;
        border-radius: 50%;
        background: #eef2f7;
        font-size: 20px;
      }
      .detail-main-image {
        width: 100%;
        aspect-ratio: 1 / 1;
        object-fit: contain;
        padding: 12px;
        border-radius: 14px;
        background: #f1f5f9;
      }
      .detail-thumbs { display: flex; gap: 8px; margin-top: 10px; overflow-x: auto; }
      .detail-thumb {
        flex: 0 0 62px;
        width: 62px;
        height: 62px;
        padding: 3px;
        border: 2px solid transparent;
        border-radius: 10px;
        object-fit: contain;
        background: #f1f5f9;
      }
      .detail-thumb.active { border-color: #059669; }
      .detail-copy { padding: 20px 8px 8px 0; }
      .detail-copy h2 { margin: 7px 42px 8px 0; font-size: clamp(22px, 4vw, 32px); line-height: 1.3; }
      .detail-variant { color: #64748b; font-size: 13px; }
      .detail-description { white-space: pre-wrap; color: #475569; line-height: 1.7; }
      .detail-price { margin: 20px 0 5px; color: #047857; font-size: 25px; }
      .detail-stock { color: #64748b; font-size: 13px; }
      .detail-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; margin-top: 20px; }
      .detail-actions button, .telegram-link {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 45px;
        border: 0;
        border-radius: 11px;
        font-weight: 800;
        text-decoration: none;
      }
      .detail-actions button { background: #059669; color: #fff; }
      .detail-actions button:disabled { background: #94a3b8; }
      .telegram-link { background: #229ed9; color: #fff; }
      @media (max-width: 900px) {
        .tools {
          grid-template-columns: 1fr 1fr;
        }
        .tools button {
          min-height: 42px;
        }
        .grid {
          grid-template-columns: repeat(4, minmax(0, 1fr));
        }
      }
      @media (max-width: 650px) {
        .product-detail { grid-template-columns: 1fr; gap: 8px; padding: 14px; }
        .detail-copy { padding: 4px 2px 2px; }
        .detail-main-image { max-height: 42vh; }
        .detail-actions { position: sticky; bottom: -14px; padding: 10px 0 14px; background: #fff; }
        .grid {
          grid-template-columns: repeat(2, minmax(0, 1fr));
          gap: 9px;
        }
        .wrap {
          width: min(100% - 18px, 1160px);
        }
        .hero {
          padding-top: 25px;
        }
        .body {
          padding: 9px;
        }
        .desc {
          display: none;
        }
        .price {
          align-items: flex-end;
          gap: 5px;
        }
        .price b {
          font-size: 12px;
        }
        .price button {
          padding: 7px 8px;
          font-size: 11px;
        }
      }
      @media (max-width: 360px) {
        .grid {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <header class="top">
      <div class="wrap">
        <img id="logo" class="logo" alt="" />
        <div class="brand">
          <b id="shopName">Online Shop</b
          ><small id="shopMeta">Powered by Mahar POS</small>
        </div>
        <button class="cartbtn" onclick="openCart()">
          Cart · <span id="cartCount">0</span>
        </button>
      </div>
    </header>
    <section class="hero">
      <div class="wrap">
        <h1 id="heroName">Online Shop</h1>
        <p id="heroDesc">
          ပစ္စည်းများကို Online မှ ရွေးချယ်ပြီး COD သို့မဟုတ်
          ဆိုင်တွင်လာယူနိုင်ပါသည်။
        </p>
        <div class="tools">
          <input id="search" placeholder="ပစ္စည်းအမည် ရှာရန်" />
          <select id="brandFilter">
            <option value="">All Brands</option>
          </select>
          <select id="categoryFilter">
            <option value="">All Categories</option>
          </select>
          <select id="stockFilter">
            <option value="">All Stock Levels</option>
            <option value="IN_STOCK">In Stock</option>
            <option value="LOW_STOCK">Low Stock</option>
            <option value="OUT_OF_STOCK">Out of Stock</option>
          </select>
          <button onclick="loadProducts()">Search</button>
        </div>
      </div>
    </section>
    <main class="wrap">
      <div id="message"></div>
      <div id="grid" class="grid">
        <div class="empty">Loading products...</div>
      </div>
      <nav id="pagination" class="pagination" aria-label="Product pages"></nav>
    </main>
    <div
      id="shade"
      class="shade"
      onclick="if (event.target === this) closeCart();"
    >
      <aside class="drawer">
        <div class="drawer-head">
          <h2>Shopping Cart</h2>
          <button onclick="closeCart()">Close</button>
        </div>
        <div id="cartLines"></div>
        <div class="total"><span>Total</span><b id="total">0 MMK</b></div>
        <form class="checkout" onsubmit="submitOrder(event)">
          <input id="customerName" required placeholder="အမည်" /><input
            id="customerPhone"
            required
            placeholder="ဖုန်းနံပါတ်"
          /><select id="method" onchange="toggleAddress()">
            <option value="COD">COD Delivery</option>
            <option value="PICKUP">ဆိုင်တွင်လာယူမည်</option></select
          ><textarea
            id="address"
            required
            placeholder="ပို့ဆောင်ရမည့်လိပ်စာ"
          ></textarea
          ><textarea id="note" placeholder="မှတ်ချက် (Optional)"></textarea
          ><button id="orderBtn">Order တင်မည်</button>
          <div id="orderMessage"></div>
        </form>
      </aside>
    </div>
    <div id="productModal" class="product-modal" onclick="if (event.target === this) closeProduct();">
      <section class="product-detail" role="dialog" aria-modal="true" aria-labelledby="detailName">
        <button class="detail-close" onclick="closeProduct()" aria-label="Close">×</button>
        <div>
          <img id="detailImage" class="detail-main-image" alt="" />
          <div id="detailThumbs" class="detail-thumbs"></div>
        </div>
        <div class="detail-copy">
          <span id="detailCategory" class="cat"></span>
          <h2 id="detailName"></h2>
          <div id="detailVariant" class="detail-variant"></div>
          <p id="detailDescription" class="detail-description"></p>
          <div id="detailPrice" class="detail-price"></div>
          <div id="detailStock" class="detail-stock"></div>
          <div class="detail-actions">
            <button id="detailAdd" type="button">Cart ထဲထည့်မည်</button>
            <a id="telegramChat" class="telegram-link" target="_blank" rel="noopener noreferrer">Telegram Chat</a>
          </div>
        </div>
      </section>
    </div>
    <script>
      const slug = decodeURIComponent(
        location.pathname.match(/\/shop\/([^/?#]+)/)?.[1] ||
          new URLSearchParams(location.search).get("shop") ||
          "",
      );
      let store = null,
        products = [],
        cart = [],
        currentPage = 1,
        totalPages = 1,
        totalProducts = 0;
      const api = (p, o = {}) =>
        fetch("/api" + p, {
          headers: { "Content-Type": "application/json" },
          ...o,
        }).then(async (r) => {
          const d = await r.json();
          if (!r.ok) throw Error(d.message || "Request failed");
          return d;
        });
      const mmk = (n) => Number(n || 0).toLocaleString() + " MMK";
      async function init() {
        try {
          const d = await api("/public/store/" + encodeURIComponent(slug));
          store = d.store;
          shopName.textContent = heroName.textContent = store.name;
          heroDesc.textContent = store.description || heroDesc.textContent;
          shopMeta.textContent =
            [store.phone, store.address].filter(Boolean).join(" · ") ||
            "Powered by Mahar POS";
          if (store.logoUrl) {
            logo.src = store.logoUrl;
          } else logo.style.visibility = "hidden";
          method.innerHTML =
            (store.deliveryEnabled
              ? '<option value="COD">COD Delivery</option>'
              : "") +
            (store.pickupEnabled
              ? '<option value="PICKUP">ဆိုင်တွင်လာယူမည်</option>'
              : "");
          toggleAddress();
          await loadProducts();
        } catch (e) {
          grid.innerHTML = '<div class="empty">' + esc(e.message) + "</div>";
        }
      }
      async function loadProducts(page = 1) {
        try {
          const d = await api(
            "/public/store/" +
              encodeURIComponent(slug) +
              "/products?search=" +
              encodeURIComponent(search.value) +
              "&brand=" +
              encodeURIComponent(brandFilter.value) +
              "&categoryId=" +
              encodeURIComponent(categoryFilter.value) +
              "&stockLevel=" +
              encodeURIComponent(stockFilter.value) +
              "&page=" +
              encodeURIComponent(page),
          );
          products = d.products || [];
          currentPage = Number(d.page || 1);
          totalPages = Number(d.totalPages || 1);
          totalProducts = Number(d.total || products.length);
          const selectedBrand = brandFilter.value;
          const selectedCategory = categoryFilter.value;
          brandFilter.innerHTML =
            '<option value="">All Brands</option>' +
            (d.brands || [])
              .map(
                (brand) =>
                  `<option value="${esc(brand)}">${esc(brand)}</option>`,
              )
              .join("");
          categoryFilter.innerHTML =
            '<option value="">All Categories</option>' +
            (d.categories || [])
              .map(
                (category) =>
                  `<option value="${esc(category.id)}">${esc(category.name)}</option>`,
              )
              .join("");
          brandFilter.value = selectedBrand;
          categoryFilter.value = selectedCategory;
          renderProducts();
          renderPagination();
        } catch (e) {
          grid.innerHTML = '<div class="empty">' + esc(e.message) + "</div>";
        }
      }
      function renderProducts() {
        grid.innerHTML =
          products
            .map((p, i) => {
              const v = p.variants?.find(
                  (variant) =>
                    Number(variant.inventoryBalance?.quantity || 0) > 0,
                ),
                img =
                  p.ecommerceImages?.[0]?.url || "/default-product-image.svg",
                stock =
                  p.variants?.reduce(
                    (s, x) => s + Number(x.inventoryBalance?.quantity || 0),
                    0,
                  ) || 0;
              const price = Number(v?.standardSellingPrice || 0);
              return `<article class="card" onclick="openProduct(${i})" tabindex="0" onkeydown="if(event.key==='Enter') openProduct(${i})"><div class="photo"><img src="${esc(img)}" alt="${esc(p.name)}" onerror="this.onerror=null;this.src='/default-product-image.svg'">${stock > 0 ? `<span class="stock">${stock} in stock</span>` : ""}</div><div class="body"><span class="cat">${esc(p.category?.name || "Product")}</span><h3>${esc(p.name)}</h3><div class="desc">${esc(p.ecommerceDetail?.description || "")}</div><div class="price">${price > 0 ? `<b>${mmk(price)}</b>` : "<span></span>"}<button ${!v ? "disabled" : ""} onclick="event.stopPropagation();add(${i})">Add</button></div></div></article>`;
            })
            .join("") ||
          '<div class="empty">Online မှာပြထားသော Product မရှိသေးပါ။</div>';
      }
      function add(i) {
        const p = products[i],
          v = p.variants?.find(
            (variant) => Number(variant.inventoryBalance?.quantity || 0) > 0,
          );
        if (!v) return;
        const found = cart.find((x) => x.variantId === v.id);
        if (found) found.quantity++;
        else
          cart.push({
            variantId: v.id,
            name: p.name,
            variant: v.variantName,
            price: Number(v.standardSellingPrice),
            quantity: 1,
          });
        renderCart();
      }
      function renderPagination() {
        if (totalProducts <= 10) { pagination.innerHTML = ''; return; }
        const pages = [];
        const start = Math.max(1, currentPage - 2);
        const end = Math.min(totalPages, start + 4);
        for (let page = Math.max(1, end - 4); page <= end; page++) pages.push(page);
        pagination.innerHTML = `<button ${currentPage <= 1 ? 'disabled' : ''} onclick="goPage(${currentPage - 1})">‹</button>${pages.map((page) => `<button class="${page === currentPage ? 'active' : ''}" onclick="goPage(${page})">${page}</button>`).join('')}<button ${currentPage >= totalPages ? 'disabled' : ''} onclick="goPage(${currentPage + 1})">›</button><span class="page-summary">${totalProducts} Products</span>`;
      }
      function goPage(page) {
        if (page < 1 || page > totalPages || page === currentPage) return;
        loadProducts(page).then(() => document.querySelector('main').scrollIntoView({ behavior: 'smooth' }));
      }
      function openProduct(i) {
        const p = products[i];
        if (!p) return;
        const v = p.variants?.find((variant) => Number(variant.inventoryBalance?.quantity || 0) > 0) || p.variants?.[0];
        const stock = p.variants?.reduce((sum, variant) => sum + Number(variant.inventoryBalance?.quantity || 0), 0) || 0;
        const images = (p.ecommerceImages || []).map((image) => image.url).filter(Boolean);
        if (!images.length) images.push('/default-product-image.svg');
        detailName.textContent = p.name || '';
        detailCategory.textContent = p.category?.name || 'Product';
        detailVariant.textContent = [p.brand, v?.variantName].filter(Boolean).join(' · ');
        detailDescription.textContent = p.ecommerceDetail?.description || 'အသေးစိတ်သိရှိလိုပါက ဆိုင်သို့ Telegram မှ ဆက်သွယ်မေးမြန်းနိုင်ပါသည်။';
        detailPrice.textContent = Number(v?.standardSellingPrice || 0) > 0 ? mmk(v.standardSellingPrice) : '';
        detailStock.textContent = stock > 0 ? `လက်ကျန် ${stock}` : 'လက်ကျန်မရှိပါ';
        detailAdd.disabled = stock <= 0;
        detailAdd.onclick = () => { add(i); closeProduct(); openCart(); };
        telegramChat.hidden = !store?.telegramUrl;
        if (store?.telegramUrl) telegramChat.href = store.telegramUrl;
        selectDetailImage(images[0], 0);
        detailThumbs.innerHTML = images.map((url, index) => `<button type="button" style="border:0;background:none;padding:0" onclick="selectDetailImage('${escJs(url)}',${index})"><img class="detail-thumb${index === 0 ? ' active' : ''}" src="${esc(url)}" alt="${esc(p.name)} ${index + 1}" onerror="this.onerror=null;this.src='/default-product-image.svg'"></button>`).join('');
        productModal.classList.add('open');
        document.body.style.overflow = 'hidden';
      }
      function selectDetailImage(url, index) {
        detailImage.src = url || '/default-product-image.svg';
        detailImage.onerror = () => { detailImage.onerror = null; detailImage.src = '/default-product-image.svg'; };
        document.querySelectorAll('.detail-thumb').forEach((thumb, i) => thumb.classList.toggle('active', i === index));
      }
      function closeProduct() {
        productModal.classList.remove('open');
        document.body.style.overflow = '';
      }
      function renderCart() {
        cartCount.textContent = cart.reduce((s, x) => s + x.quantity, 0);
        cartLines.innerHTML =
          cart
            .map(
              (x, i) =>
                `<div class="line"><span><b>${esc(x.name)}</b><small>${esc(x.variant || "")} · ${x.quantity} × ${mmk(x.price)}</small></span><button onclick="removeLine(${i})">Remove</button></div>`,
            )
            .join("") || "<p>Cart ထဲတွင် Product မရှိသေးပါ။</p>";
        total.textContent = mmk(
          cart.reduce((s, x) => s + x.price * x.quantity, 0) +
            (method.value === "COD" ? Number(store?.deliveryFee || 0) : 0),
        );
      }
      function removeLine(i) {
        cart.splice(i, 1);
        renderCart();
      }
      function openCart() {
        shade.classList.add("open");
        renderCart();
      }
      function closeCart() {
        shade.classList.remove("open");
      }
      function toggleAddress() {
        address.hidden = method.value !== "COD";
        address.required = method.value === "COD";
        renderCart();
      }
      async function submitOrder(e) {
        e.preventDefault();
        if (!cart.length) return showOrder("Cart ထဲတွင် Product ထည့်ပါ။", true);
        orderBtn.disabled = true;
        try {
          const d = await api(
            "/public/store/" + encodeURIComponent(slug) + "/orders",
            {
              method: "POST",
              body: JSON.stringify({
                customerName: customerName.value,
                customerPhone: customerPhone.value,
                deliveryAddress: address.value,
                fulfillmentMethod: method.value,
                note: note.value,
                items: cart.map((x) => ({
                  variantId: x.variantId,
                  quantity: x.quantity,
                })),
              }),
            },
          );
          cart = [];
          renderCart();
          showOrder(
            "Order အောင်မြင်ပါသည်။ Order No: " + d.order.orderNumber,
            false,
          );
        } catch (e) {
          showOrder(e.message, true);
        } finally {
          orderBtn.disabled = false;
        }
      }
      function showOrder(t, bad) {
        orderMessage.className = "notice" + (bad ? " error" : "");
        orderMessage.textContent = t;
      }
      function esc(v) {
        return String(v || "").replace(
          /[&<>"']/g,
          (c) =>
            ({
              "&": "&amp;",
              "<": "&lt;",
              ">": "&gt;",
              '"': "&quot;",
              "'": "&#39;",
            })[c],
        );
      }
      function escJs(v) {
        return String(v || '').replace(/\\/g, '\\\\').replace(/'/g, "\\'").replace(/[\r\n]/g, '');
      }
      document.addEventListener('keydown', (event) => {
        if (event.key === 'Escape') { closeProduct(); closeCart(); }
      });
      search.addEventListener("keydown", (e) => {
        if (e.key === "Enter") loadProducts(1);
      });
      [brandFilter, categoryFilter, stockFilter].forEach((filter) =>
        filter.addEventListener("change", () => loadProducts(1)),
      );
      init();
    </script>
  </body>
</html>
