<!doctype html>
<html lang="my">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0E1B2C">
<title>Digital Products · Mahar POS</title>
<meta name="description" content="Game top-up နှင့် VPN — ချက်ချင်း ဖြည့်ပေးသည်။">
<link rel="icon" type="image/png" href="/mahar-pos-logo-192.png">
<link rel="apple-touch-icon" href="/mahar-pos-logo-192.png">
<link rel="manifest" href="/digital/manifest.webmanifest">
<link rel="stylesheet" href="/digital/shared.css">
<style>
.hub-card{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:14px;padding:19px;border-radius:var(--radius);background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow);cursor:pointer;text-align:left;font-family:inherit;color:inherit;transition:transform .15s,box-shadow .15s}
.hub-card:hover{transform:translateY(-2px);box-shadow:var(--shadow-lg)}
.hub-card .hub-ic{width:52px;height:52px;border-radius:15px;display:grid;place-items:center;font-size:24px;flex-shrink:0}
.hub-card.game .hub-ic{background:linear-gradient(135deg,#e0e7ff,#dbeafe);}
.hub-card.vpn .hub-ic{background:linear-gradient(135deg,#dcfce7,#d1fae5);}
.hub-card h3{font-size:15.5px}
.hub-card p{font-size:12.5px;color:var(--muted);margin-top:2px}
.hub-card .arrow{font-size:19px;color:var(--muted)}
</style>
</head>
<body>
<div class="wrap">

  <div class="top">
    <div class="brand">
      <img src="/mahar-pos-logo-192.png" alt="Mahar POS">
      <div><b>Digital Products</b><span>ချက်ချင်း ရရှိသည်</span></div>
    </div>
    <div class="top-actions">
      <button id="installBtn" class="hid" type="button" title="App ထည့်မည်">⬇</button>
    </div>
  </div>

  <div class="section-label">ဝန်ဆောင်မှုများ</div>

  <a class="hub-card game" href="/digital/game/">
    <div class="hub-ic">🎮</div>
    <div><h3>Game Top-up</h3><p>Mobile Legends, PUBG, Free Fire — Diamond / UC ချက်ချင်းဖြည့်</p></div>
    <div class="arrow">›</div>
  </a>

  <a class="hub-card vpn" href="/digital/vpn/">
    <div class="hub-ic">🛡️</div>
    <div><h3>Mahar Shwe VPN</h3><p>Android VPN app — APK Download နှင့် Plan ဝယ်ရန်</p></div>
    <div class="arrow">›</div>
  </a>

  <footer>Mahar POS · <a href="https://t.me/maharshwebot">ဆက်သွယ်ရန်</a></footer>
</div>

<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const show = (el, on) => el.classList.toggle('hid', !on);

  // Links already handed out before this hub existed pointed straight at
  // "/digital/" for both an order-status check and a shop's own storefront
  // pill — sending those on to the page that now actually owns that content
  // keeps every link anyone has ever received or bookmarked working.
  const qs = new URLSearchParams(location.search);
  if (qs.get('view') === 'status' || qs.get('shop')) {
    location.replace('/digital/game/' + location.search);
    return;
  }

  // ── install (PWA) ──
  let installPrompt = null;
  addEventListener('beforeinstallprompt', (event) => {
    event.preventDefault();
    installPrompt = event;
    show($('installBtn'), true);
  });
  addEventListener('appinstalled', () => { installPrompt = null; show($('installBtn'), false); });
  $('installBtn').addEventListener('click', async () => {
    if (!installPrompt) return;
    installPrompt.prompt();
    const result = await installPrompt.userChoice;
    if (result.outcome === 'accepted') { installPrompt = null; show($('installBtn'), false); }
  });
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('/digital/sw.js', { scope: '/digital/' }).catch(() => {});
})();
</script>
</body>
</html>
