<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#13a36f" />
    <meta name="color-scheme" content="light dark" />
    <title>Mahar Shwe Mobile POS</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/png" href="/maharshwe-logo.png?v=20260617-settings" />
    <link rel="shortcut icon" type="image/png" href="/maharshwe-logo.png?v=20260617-settings" />
    <link rel="apple-touch-icon" href="/maharshwe-logo.png?v=20260617-settings" />
    <style>
      #app-boot-status{position:fixed;inset:0;display:grid;place-items:center;background:#f8fafc;color:#334155;font-family:Arial,sans-serif;z-index:999999}
      #app-boot-status>div{text-align:center;padding:24px}
      #app-boot-status b{display:block;margin-bottom:8px;font-size:18px;color:#166534}
      #app-boot-status small{color:#64748b}
    </style>
    <script>
      (function () {
        try {
          var runtimeVersion = '20260702-disable-app-shell-sw';
          var previousVersion = window.localStorage.getItem('mahar-runtime-version');
          if (previousVersion !== runtimeVersion) {
            window.localStorage.setItem('mahar-runtime-version', runtimeVersion);
          }
          if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then(function (registrations) {
              registrations.forEach(function (registration) {
                var scriptUrl = (registration.active && registration.active.scriptURL)
                  || (registration.waiting && registration.waiting.scriptURL)
                  || (registration.installing && registration.installing.scriptURL)
                  || '';
                if (!/firebase-messaging-sw\.js/i.test(scriptUrl)) {
                  registration.unregister().catch(function () {});
                }
              });
            }).catch(function () {});
          }
          if ('caches' in window) {
            caches.keys().then(function (keys) {
              return Promise.all(keys
                .filter(function (key) { return !/firebase|fcm|messaging/i.test(key); })
                .map(function (key) { return caches.delete(key); }));
            }).catch(function () {});
          }
        } catch (error) {
          console.warn('Runtime cleanup bootstrap failed:', error);
        }
      })();
    </script>
  </head>
  <body>
    <div id="app-boot-status"><div><b>Mahar POS</b><small>Loading PostgreSQL Settings...</small></div></div>
    <div id="root"></div>
    <script type="module" src="/src/bootstrap-secure.jsx"></script>
  </body>
</html>
